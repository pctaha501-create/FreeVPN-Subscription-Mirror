name: Refresh public subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-public-subscription
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate feed
        run: python scripts/update_feed.py

      - name: Commit changed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/v2ray.txt output/v2ray-base64.txt output/status.json
          if git diff --cached --quiet; then
            echo "Feed unchanged; nothing to commit."
          else
            git commit -m "chore: refresh public proxy subscription"
            git push
          fi
